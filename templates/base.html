<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Portfolio Tracker{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% block head %}{% endblock %}
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #252836;
    --border: #2e3348; --text: #e4e4e7; --muted: #9ca3af;
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --purple: #a855f7; --orange: #f97316; --cyan: #06b6d4;
    --yellow: #eab308; --pink: #ec4899;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header h1 a { color: inherit; text-decoration: none; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .user-menu { display: flex; gap: 8px; align-items: center; margin-left: 8px; padding-left: 16px; border-left: 1px solid var(--border); font-size: 0.85rem; color: var(--muted); }

  .btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .btn:hover { background: var(--surface2); border-color: var(--blue); }
  .btn-primary { background: var(--blue); border-color: var(--blue); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: white; }
  .btn-sm { padding: 4px 10px; font-size: 0.75rem; }

  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .card-value { font-size: 1.6rem; font-weight: 700; }
  .card-sub { font-size: 0.85rem; margin-top: 4px; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }

  .charts-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .chart-card h3 { font-size: 0.95rem; margin-bottom: 12px; color: var(--muted); }
  .chart-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toggle-group { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-btn { padding: 6px 14px; background: var(--surface); color: var(--muted); border: none; cursor: pointer; font-size: 0.8rem; }
  .toggle-btn.active { background: var(--blue); color: white; }

  .investments-section h2 { font-size: 1.1rem; margin-bottom: 12px; }
  .inv-table { width: 100%; border-collapse: collapse; }
  .inv-table th { text-align: left; padding: 10px 12px; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .inv-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .inv-table tr:hover { background: var(--surface2); }
  .type-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }
  .type-stock { background: rgba(59,130,246,0.15); color: var(--blue); }
  .type-etf { background: rgba(168,85,247,0.15); color: var(--purple); }
  .type-gold_etf { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .type-mutual_fund { background: rgba(6,182,212,0.15); color: var(--cyan); }
  .type-crypto { background: rgba(249,115,22,0.15); color: var(--orange); }
  .type-pf { background: rgba(34,197,94,0.15); color: var(--green); }
  .type-fd { background: rgba(236,72,153,0.15); color: var(--pink); }

  .expandable { cursor: pointer; }
  .txn-row { display: none; }
  .txn-row.show { display: table-row; }
  .txn-row td { padding-left: 40px; color: var(--muted); font-size: 0.8rem; background: var(--surface2); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; font-size: 1.1rem; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .search-results { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; }
  .search-results div { padding: 8px 12px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .search-results div:hover { background: var(--surface2); }
  .search-results div small { color: var(--muted); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,17,23,0.7); display: flex; align-items: center; justify-content: center; border-radius: 12px; }

  .empty-state { text-align: center; padding: 40px; color: var(--muted); }

  /* Flatpickr overrides to match theme */
  .flatpickr-calendar {
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
  }
  .flatpickr-months .flatpickr-month,
  .flatpickr-current-month .flatpickr-monthDropdown-months { background: var(--surface) !important; color: var(--text) !important; }
  .flatpickr-current-month input.cur-year { color: var(--text) !important; }
  .flatpickr-months .flatpickr-prev-month, .flatpickr-months .flatpickr-next-month { fill: var(--muted) !important; color: var(--muted) !important; }
  .flatpickr-months .flatpickr-prev-month:hover, .flatpickr-months .flatpickr-next-month:hover { fill: var(--text) !important; color: var(--text) !important; }
  span.flatpickr-weekday { color: var(--muted) !important; background: var(--surface) !important; font-weight: 600; }
  .flatpickr-day { color: var(--text) !important; border-radius: 6px !important; }
  .flatpickr-day:hover { background: var(--surface2) !important; border-color: var(--border) !important; }
  .flatpickr-day.selected { background: var(--blue) !important; border-color: var(--blue) !important; color: white !important; }
  .flatpickr-day.today { border-color: var(--blue) !important; }
  .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--border) !important; }
  .flatpickr-day.disabled { color: var(--border) !important; }
  .flatpickr-innerContainer { border-bottom: none !important; }
  .flatpickr-rContainer { padding: 4px !important; }
  .flatpickr-current-month { display: flex !important; align-items: center !important; gap: 4px !important; }
  .flatpickr-current-month .flatpickr-monthDropdown-months,
  .numInputWrapper { background: var(--bg) !important; border: 1px solid var(--border) !important; border-radius: 6px !important; color: var(--text) !important; padding: 2px 4px !important; }
  .flatpickr-current-month .flatpickr-monthDropdown-months option { background: var(--surface) !important; color: var(--text) !important; }
  .numInputWrapper input { color: var(--text) !important; }
  .numInputWrapper span { border-color: var(--muted) !important; }
  .numInputWrapper span:hover { background: var(--surface2) !important; }
  .flatpickr-current-month input.cur-year { font-size: 0.9rem !important; }
  /* Region switcher */
  .header-title { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  a.toggle-btn { text-decoration: none; display: inline-block; }
  .toggle-btn:hover:not(.active) { color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-title">
      <h1><a href="{{ url_for('index') }}" title="Overview">Portfolio Tracker</a></h1>
      <nav class="toggle-group" aria-label="Portfolio">
        {% for id, cfg in regions.items() %}
        <a class="toggle-btn{% if page == id %} active{% endif %}" href="{{ url_for(cfg.endpoint) }}">{{ cfg.name }}</a>
        {% endfor %}
      </nav>
    </div>
    <div class="header-actions">
      {% block actions %}{% endblock %}
      <form class="user-menu" method="post" action="{{ url_for('logout') }}">
        <span>{{ username }}</span>
        <button class="btn" type="submit">Log out</button>
      </form>
    </div>
  </header>

  {% block content %}{% endblock %}
</div>

{% block modals %}{% endblock %}

<script>window.PAGE = {{ page_config|tojson }};</script>
{% block scripts %}{% endblock %}
</body>
</html>
